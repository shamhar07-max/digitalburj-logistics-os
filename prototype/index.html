<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress benign third-party browser extension injection errors (MetaMask, Web3, wallet extensions)
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (
          typeof msg === 'string' &&
          (msg.includes('MetaMask') ||
            msg.includes('ethereum') ||
            msg.includes('web3') ||
            msg.includes('chrome-extension://'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = (event && (event.reason && (event.reason.message || event.reason))) || '';
        if (
          typeof reason === 'string' &&
          (reason.includes('MetaMask') ||
            reason.includes('ethereum') ||
            reason.includes('web3') ||
            reason.includes('chrome-extension://'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
    <title>DigitalBurj Logistics OS</title>
